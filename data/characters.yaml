    梦入神机《龙符》的主角，大永王朝十九皇子，无龙内阁阁主，永界之主。

    **起点即锚点**：第二章获得祭天符诏，献祭一只大公鸡起步——此时他被公鸡爪抓伤「皮肉抓下大块」，需持匕首才能反杀，文中直言只有「缚鸡之力」。这完全落在现实生理伤害范围内，是全书最干净的一个结论：**《龙符》的基础世界强度 = 现实世界 × 1.0**，凡人层不偏离现实，可直接套用《材质与破坏能量数据库》，不需要先做换算。

    反证同样成立：道境三十六变里「刀枪不入」要到**第三变**才达成。把「免疫常规兵刃」设为需要修炼两个阶段才能获得的能力，恰恰反证了这个世界的常人和常规兵器遵循现实物理规律。

    **资质与功法**：凭祭天符诏起步（唯一可用者为「天命之子」及以上资质）。核心功法**天子封神术**分三境——日月同辉、天地同寿、众生同心；全书他仅修得第一境「日月炼」的皮毛（不足十分之一），凭此已破入凡境四重宗师，原文称「比起什么龙王劲斩雷劲，却又不知道高明了几千几百倍」。天地同寿一境，连上古天子「虚」本人都未能修成。

    ### 成长曲线

