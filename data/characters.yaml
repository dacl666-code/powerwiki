# 角色数据
#
# 字段说明：
#   name              角色名（必填）
#   slug              URL 标识，不填则按 name 自动生成
#   alias             别名
#   series            出处作品
#   category          所属档位 slug，必须存在于 data/categories.yaml
#   realm             作品内的境界名（可选，仅作标签显示；
#                     若要生成境界页链接，需在 data/realms.yaml 中定义）
#   image_url         立绘/剧照外链（可选，留空显示「暂无图片」）
#   description       角色介绍 / 战绩，支持 Markdown
#   power_description 能力说明，支持 Markdown
#
# 定级口径：一律取该角色**最终 / 最高**形态，不以中期表现为准。
# 与档位体系（92 档）的对应关系见 data/categories.yaml 与《战力量级体系》。
#
# 本文件为顶层列表，不是 characters: 映射——build_site.py 直接按列表读取。

- name: 叶凡
  slug: ye-fan
  alias: 叶天帝、叶黑、三天帝之一
  series: 遮天（辰东三部曲）
  category: incomputable-expansion
  realm: 祭道之上
  image_url: ''
  description: |
    辰东三部曲《遮天》的主角，后于《完美世界》《圣墟》中继续登场，最终与石昊、楚风并列为「三天帝」之一。

    起点是地球上的一个普通青年，被九龙拉棺带至北斗星域，从轮海秘境一路修至红尘仙。《遮天》结局证道成帝，《完美世界》时期为准仙帝层级，《圣墟》结局突破至全书最高的**祭道之上**——全书仅四人达至此境。

    祭道之上的原文描述为：一念间可将无量宇宙时空、无穷的宇宙海、世界海、时光海等，也就是整个世界观，汇聚成一个原初；原初又有无尽的原初，然后汇聚成一；无尽的一再次汇聚更大的一，无限迭代汇聚归一。
  power_description: |
    **终局评级：广义无限区 · 不可计算扩张率（未触及论外级）。**

    依据《辰东三部曲战力与世界观综合分析》第 4.3 节对祭道之上的判定。该档原文的结构为「定义一个操作 → 套用 → 把结果打包为新起点 → 再套用 → 宣称无限重复」，与本项目此前拆解的同类设定同属一个模式：

    - **按 3.10.3 信号一（增长悖论）**：「无限迭代」是**进行中的过程**，而非完成态。完成态的无限不会被写成需要反复执行的迭代。
    - **按 4.3.1（序数／迭代不构成攀爬阶梯）**：若该存在真已处于此层次，此类迭代对其为随手可及，不构成需要跨越的阶梯，因此不能据此向上累加档位。
    - **按 0.2（虚词默认）**：「仙帝在其面前只是普通人」一句带「如」字，是明喻；VSBW 据此判定的 Baseline High 1-A 不予采信。

    综合判定：全段为纯否定式修辞与迭代宣称，无可操作内容，**不予升格**，归入动态的不可计算扩张率一档，不进入论外级（真 ℵ₀）及以上。

    需要并读的一条反向证据：同一分析中，红尘仙生死战的实际破坏仅为大陆级（4.18×10²⁴ J 上界），低于圣人档标称能力约 5.4×10⁷ 倍；即便给足材质修正，抬到宇宙级所需的 ×1.9×10⁵³ 也早已超出「材料更硬」可解释的范畴。因此本条目的定级**完全建立在顶层描述的方法论处理上**，不与中低段的可换算数值衔接。

- name: 古尘沙
  slug: gu-chensha
  alias: 无龙内阁阁主、永界之主、多元宇宙缔造者
  series: 龙符（梦入神机）
  category: incomputable-expansion
  realm: 不朽第十层·非有无不朽
  image_url: ''
  description: |
    梦入神机《龙符》的主角，大永王朝十九皇子，无龙内阁阁主，永界之主。

    自献祭一只大公鸡起步，历凡境四重、道境三十六变、天道境，长期是不朽第九层「无不朽」的唯一达成者；约第 900 章创造龙符、凝聚「永界」；第 1149 章首创并修成**不朽第十层·非有无不朽**，结局状态为「永远无敌」。

    创《大哉苍生普渡化人经》，立补天、革天二圣道，创无龙心法。其力量来源为体系内部的人心祭祀与无龙心法吸收。
  power_description: |
    **终局评级：广义无限区级 · 不可计算扩张率；未触及论外级（真 ℵ₀），且状态本身存在文本自证的不稳定性。**

    依据《龙符世界观与战力综合分析》6.1.1 节的五步判定：

    1. **排除静态不可计算数与论外级**：「超脱万物、超脱大道、超脱命运」为纯定性堆叠，不过 0.2 门槛；「一千零一尊主角」是叙事者给出的**具体计数**而非无限（信号 2，邻近量化悖论）；按 0.15，其力量取自体系内部，而体系内的天界、时空乱流已确认为有限。
    2. **归入动态扩张率而非静态判定**：终局描述通篇是过程性语言，而非完成态宣告——「每隔亿年就会出现一尊最强的巨头来挑战」带具体周期；古尘沙自陈「也许下个亿年，也许永远不会来」，无一处是「已经封顶」的口吻（信号 1 的反面应用：完成态的无限不会呈现为进行中的过程）。
    3. **其本人给出的「主角」定义即为有限结构**：村子有村子的主角，星球、星域各自另有其人；他承认自己只是「对于整个多元宇宙来说」这一层的当前最强者，且「其它的主角」仍会为气数所感而冒出来与他竞争。真正的完成态无限不存在「下一个」——这是他自己给出的定义，不是外部强加的怀疑。
    4. **不稳定性警告**：他自陈「强行打破规律，必定要会被反噬」（第 1104 章，平静场合陈述）。此与第 1147 章一尊万亿寿命巨头脱离限制后力量失控、共振自毁化为灰烬的案例同构，两者是同一模板。该警告不改变基础判定，但意味着这一终局状态**未必是稳定终点**。
    5. **辅助证据（证据力较弱）**：在两个世界之间做取舍属资源分配式的战术行为，真正的无限存在不需要此类选择。

    备注：其成长曲线自「需楼拜月协同才能击退道境二变」到「单挑击杀道境十四变」之间存在**材料缺口**，中间跃升过程未见完整战斗描写，引用时不可凭空插值。
