    | 阶段二封顶 | 宗师体能极限 | 「四牛之力」，天露封顶「五牛」，明确不可再靠丹药突破 | 第三十二章 | 已确认 |
    | 阶段三 | 道境入门附近 | 巨灵神枪三式合一击退道境二变黑煞蝙蝠（**需楼拜月协同，独力不敌**） | 第三十二章 | 已确认 |
    | 阶段三进阶 | 道境（变数未明） | 裂海霹雳子近身自爆生还，肉身可扛「小半县城」级冲击波边缘 | 第六十章 | 合理推测 |
    | 阶段四 | — | 单挑击杀道境十四变雷兽王雷武煞，斩三大蛮王 | 第 197 章 | 已确认（战绩），未量化 |
