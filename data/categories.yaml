# ============================================================
# 战力量级体系表（= 首页「战力等级」= 角色分类档位）
# ------------------------------------------------------------
# 本文件是站点档位数据的唯一来源，与 data/pages/rules.md《战力量级体系》
# 一一对应：rules.md 改档位 -> 改这里 -> 重新构建，首页 / 量级体系表页 /
# 分类页 / 搜索筛选器全部自动同步。
#
# 字段说明：
#   slug        URL 标识（category/<slug>.html），改名会断链，尽量保持稳定
#   name        档位名，取自 rules.md 1.3 量级表的「细分」列
#   type        power = 战力量级档位（目前只有这一类）
#   group       所属体系分段，见下方 groups
#   parent      所属量级（父档），如「爆砖」；细分档位共享父量级
#   sort_order  全站由弱到强的排序值，间隔 10 便于插档
#   energy      能量区间（焦耳），照抄 rules.md，未定档留空
#   scale       覆盖尺度 / 参照物
#   note        判定要点、口径说明、修正记录（可选）
#   source      rules.md 中对应的小节标题，构建时自动解析成锚点链接
#
# ── 与旧框架的差异（本次推倒重做的部分）──────────────────────
# 旧 categories.yaml 沿用汪吧/维基式命名（弱单体·多元·高阶多元·无限盒子·
# 无限层无限盒子·无限次方无限盒子·多层无限盒子·无限指数塔·超指数塔·
# 高阶无限×3·无限多元·低维·微观 等），与 rules.md 现行体系已不符，全部废弃。
# 旧档 -> 新档的归位对照：
#   低维 / 微观                        -> 取消（昆虫级以下不单列，落 未知）
#   弱单体/单体/强单体/超单体           -> 弱宇宙/标准宇宙/强宇宙/超宇宙（3.9）
#   弱多元/多元/强多元/高阶多元/无限多元 -> 星系团级·宇宙结构级（3.7/3.8）
#                                        或 广义无限区级（3.10），按覆盖尺度定
#   无限盒子系列 / 无限指数塔 / 超指数塔 -> 广义无限区级（3.10）或 论外级（4.5）
#   论外                               -> 论外级八档（4.5：门槛/三线/二线/一线/
#                                        论天下/论天中/论天上/论天最上）
# 已收录角色若挂在废弃档上，请改挂新档；无法定档的先放「暂存」或「未知」。
# ============================================================

groups:
  - id: inherit
    name: 第一部分 · 继承区
    note: 昆虫 ～ 爆恒星，沿用汪吧标准，本体系已做衔接核查与修正（强大陆倒挂、爆街→爆城过渡区、增设爆褐矮星）
  - id: transition-a
    name: 第二部分 · 过渡带 A（恒星 → 恒星系）
    note: 继承区与覆盖体系之间 7.3 个数量级的命名空白，不新设量级名称，用「弱化/强化 + 相邻档」或直接标能量
  - id: cover
    name: 第三部分 · 覆盖体系
    note: 爆恒星之上，本体系原创。按覆盖范围 × 边缘阈值 F* = 1.64×10²³ J/m² 计算，不按物质能量求和
  - id: transition-b
    name: 第二部分 · 过渡带 B（恒星系 → 星团）
    note: 覆盖体系内部的第二段命名空白，处理方式与过渡带 A 相同
  - id: infinite
    name: 3.10 · 广义无限区级
    note: 有限 · 不可计算。仍是有限量，只是写不出那个焦耳数；跨过 ℵ₀ 才是论外级
  - id: beyond
    name: 第四部分 · 论外级
    note: 真无限，ℵ₀ 起。规模同为 ℵ₀，档内用序数比结构复杂度，不用序数比大小
  - id: unfiled
    name: 未归档
    note: 体系之外的两个兜底档，固定排在最末

