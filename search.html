<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索 - 全作品战力评鉴所</title>
    <link rel="stylesheet" href="/powerwiki/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-umd.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/powerwiki/index.html" class="logo">全作品战力评鉴所</a>
            <nav class="main-nav">
                <a href="/powerwiki/index.html">首页</a>
                <a href="/powerwiki/characters.html">角色图鉴</a>
                <a href="/powerwiki/realm/index.html">境界体系</a>
                <a href="/powerwiki/page/rules.html">战力评级规则</a>
                <a href="/powerwiki/page/cosmology.html">材质与破坏能量数据库</a>
                <a href="/powerwiki/search.html">搜索</a>
            </nav>
        </div>
    </header>

    <main class="main-content" id="main">
    <div class="container">
        <div class="breadcrumb">
            <a href="/powerwiki/index.html">首页</a>
            <span>/</span>
            <span>搜索</span>
        </div>

        <section class="panel">
            <div class="panel-header">
                <h1>搜索</h1>
            </div>
            <form class="search-form inline" id="search-form">
                <input type="text" id="search-input" placeholder="角色名 / 别名 / 作品 / 境界 / 量级 / 简介关键词">
                <button type="submit">搜索</button>
            </form>

            <div class="filter-bar">
                <label>作品<select id="f-series"></select></label>
                <label>量级<select id="f-category"></select></label>
                <label>境界体系<select id="f-rseries"></select></label>
                <label>境界<select id="f-realm"></select></label>
                <label>排序
                    <select id="f-sort">
                        <option value="name">按名称</option>
                        <option value="cat">按量级高低</option>
                        <option value="realm">按境界阶序</option>
                    </select>
                </label>
                <button type="button" id="f-reset" class="btn btn-sm">重置</button>
            </div>

            <div id="active-filters" class="active-filters"></div>
            <p class="search-tip" id="search-tip"></p>
            <div id="search-results" class="character-grid"></div>
            <p class="empty" id="no-result" style="display:none">暂无角色数据，录入真实角色后即可搜索</p>
        </section>
    </div>

    <script>
        const indexData = [];
        const BASE = "/powerwiki";

        const el = id => document.getElementById(id);
        const qEl = el('search-input'), fSeries = el('f-series'), fCat = el('f-category'),
              fRS = el('f-rseries'), fRealm = el('f-realm'), fSort = el('f-sort'),
              resultsEl = el('search-results'), tipEl = el('search-tip'),
              noRes = el('no-result'), activeBox = el('active-filters');

        const uniq = arr => Array.from(new Set(arr.filter(Boolean)))
            .sort((a, b) => String(a).localeCompare(String(b), 'zh'));

        function fillOptions(sel, values, keep) {
            sel.innerHTML = '<option value="">全部</option>' + values.map(v =>
                '<option value="' + v + '"' + (v === keep ? ' selected' : '') + '>' + v + '</option>').join('');
        }

        // 选项联动：已选的作品/体系决定量级与境界的可选项
        function refreshOptions() {
            const sub = indexData.filter(c =>
                (!fSeries.value || c.series === fSeries.value) &&
                (!fRS.value || c.realmSeries === fRS.value));
            fillOptions(fSeries, uniq(indexData.map(c => c.series)), fSeries.value);
            fillOptions(fRS, uniq(indexData.map(c => c.realmSeries)), fRS.value);
            fillOptions(fCat, uniq(sub.map(c => c.category)), fCat.value);
            fillOptions(fRealm, uniq(sub.map(c => c.realm)), fRealm.value);
        }

        function match(c) {
            const kw = qEl.value.trim().toLowerCase();
            if (kw) {
                const hay = [c.name, c.alias, c.series, c.category, c.realm,
                             c.realmSeries, c.desc, c.power].join(' ').toLowerCase();
                if (hay.indexOf(kw) === -1) return false;
            }
            if (fSeries.value && c.series !== fSeries.value) return false;
            if (fCat.value && c.category !== fCat.value) return false;
            if (fRS.value && c.realmSeries !== fRS.value) return false;
            if (fRealm.value && c.realm !== fRealm.value) return false;
            return true;
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function render() {
            let list = indexData.filter(match);
            const s = fSort.value;
            if (s === 'cat') list.sort((a, b) => b.catOrder - a.catOrder);
            else if (s === 'realm') list.sort((a, b) => b.realmOrder - a.realmOrder);
            else list.sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh'));

            resultsEl.innerHTML = list.map(c => {
                const img = c.image ? '<img src="' + esc(c.image) + '" alt="">'
                                    : '<div class="no-image">暂无图片</div>';
                return '<a href="' + BASE + '/character/' + c.id + '.html" class="character-card">' +
                    '<div class="char-image">' + img + '</div>' +
                    '<div class="char-info"><h3>' + esc(c.name) + '</h3>' +
                    (c.series ? '<p class="char-series">' + esc(c.series) + '</p>' : '') +
                    '<div class="char-tags">' +
                    (c.category ? '<span class="tag tag-power">' + esc(c.category) + '</span>' : '') +
                    (c.realm ? '<span class="tag tag-realm">' + esc(c.realm) + '</span>' : '') +
                    '</div></div></a>';
            }).join('');

            noRes.style.display = list.length ? 'none' : '';
            tipEl.textContent = '匹配 ' + list.length + ' / ' + indexData.length + ' 位角色';
            renderActive();
            syncURL();
        }

        function renderActive() {
            const chips = [];
            const add = (label, value, key) => {
                chips.push('<span class="chip">' + label + '：' + esc(value) +
                    '<button type="button" data-clear="' + key + '">&times;</button></span>');
            };
            if (qEl.value.trim()) add('关键词', qEl.value.trim(), 'q');
            if (fSeries.value) add('作品', fSeries.value, 'series');
            if (fCat.value) add('量级', fCat.value, 'category');
            if (fRS.value) add('体系', fRS.value, 'rseries');
            if (fRealm.value) add('境界', fRealm.value, 'realm');
            activeBox.innerHTML = chips.join('');
            activeBox.querySelectorAll('button[data-clear]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.clear;
                    if (t === 'q') qEl.value = '';
                    else if (t === 'series') fSeries.value = '';
                    else if (t === 'category') fCat.value = '';
                    else if (t === 'rseries') fRS.value = '';
                    else if (t === 'realm') fRealm.value = '';
                    refreshOptions();
                    render();
                });
            });
        }

        function syncURL() {
            const p = new URLSearchParams();
            if (qEl.value.trim()) p.set('q', qEl.value.trim());
            if (fSeries.value) p.set('series', fSeries.value);
            if (fCat.value) p.set('category', fCat.value);
            if (fRS.value) p.set('rseries', fRS.value);
            if (fRealm.value) p.set('realm', fRealm.value);
            const qs = p.toString();
            history.replaceState(null, '', qs ? ('?' + qs) : location.pathname);
        }

        function readURL() {
            const p = new URLSearchParams(location.search);
            qEl.value = p.get('q') || '';
            fSeries.value = p.get('series') || '';
            fRS.value = p.get('rseries') || '';
            fCat.value = p.get('category') || '';
            fRealm.value = p.get('realm') || '';
        }

        el('search-form').addEventListener('submit', e => { e.preventDefault(); render(); });
        qEl.addEventListener('input', render);
        [fSeries, fCat, fRS, fRealm, fSort].forEach(sel => {
            sel.addEventListener('change', () => { refreshOptions(); render(); });
        });
        el('f-reset').addEventListener('click', () => {
            qEl.value = ''; fSeries.value = ''; fCat.value = '';
            fRS.value = ''; fRealm.value = ''; fSort.value = 'name';
            refreshOptions(); render();
        });

        readURL();
        refreshOptions();
        render();
    </script>

    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <p class="footer-brand">全作品战力评鉴所</p>
                <p class="footer-note">跨作品角色战力量级评鉴 · 静态资料站</p>
            </div>
            <nav class="footer-nav">
                <a href="/powerwiki/index.html">首页</a>
                <a href="/powerwiki/characters.html">角色图鉴</a>
                <a href="/powerwiki/realm/index.html">境界体系</a>
                <a href="/powerwiki/page/rules.html">战力评级规则</a>
                <a href="/powerwiki/page/cosmology.html">材质与破坏能量数据库</a>
                <a href="/powerwiki/search.html">搜索</a>
            </nav>
        </div>
    </footer>

    <script src="/powerwiki/static/js/main.js"></script>
</body>
</html>
