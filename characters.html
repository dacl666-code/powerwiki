<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>角色图鉴 - 全作品战力评鉴所</title>
    <link rel="stylesheet" href="/powerwiki/static/css/style.css">
    <script>document.documentElement.className += ' js';try{var t=localStorage.getItem('pw-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/powerwiki/index.html" class="logo">全作品战力评鉴所</a>
            <nav class="main-nav">
                <a href="/powerwiki/index.html">首页</a>
                <a href="/powerwiki/characters.html">角色图鉴</a>
                <a href="/powerwiki/realm/index.html">境界体系</a>
                <a href="/powerwiki/page/tiers.html">量级体系表</a>
                <a href="/powerwiki/page/rules.html">战力评级规则</a>
                <a href="/powerwiki/page/cosmology.html">材质与破坏能量数据库</a>
                <a href="/powerwiki/search.html">搜索</a>
            </nav>
            <button type="button" class="theme-toggle" id="theme-toggle"
                    aria-label="切换深浅色主题" title="切换深浅色主题">
                <span class="icon-sun" aria-hidden="true">☀</span>
                <span class="icon-moon" aria-hidden="true">☾</span>
            </button>
        </div>
    </header>

    <main class="main-content" id="main">
    <div class="container">
        <div class="breadcrumb">
            <a href="/powerwiki/index.html">首页</a>
            <span>/</span>
            <span>角色图鉴</span>
        </div>

        <section class="panel">
            <div class="panel-header">
                <h1>角色图鉴</h1>
                <span class="badge">2 位角色</span>
            </div>
            <div class="char-toolbar">
                <input type="text" id="name-filter" placeholder="按名称或作品快速过滤..." class="filter-input">
            </div>
            <div class="character-grid" id="char-grid">
                <a href="/powerwiki/character/ye-fan.html" class="character-card" data-name="叶凡" data-series="遮天（辰东三部曲）">
                    <div class="char-image"><div class="no-image">暂无图片</div></div>
                    <div class="char-info">
                        <h3>叶凡</h3>
                        <p class="char-series">遮天（辰东三部曲）</p>
                        <div class="char-tags"><span class="tag tag-power">不可计算扩张率</span><span class="tag tag-realm">祭道之上</span></div>
                    </div>
                </a>
                <a href="/powerwiki/character/gu-chensha.html" class="character-card" data-name="古尘沙" data-series="龙符（梦入神机）">
                    <div class="char-image"><div class="no-image">暂无图片</div></div>
                    <div class="char-info">
                        <h3>古尘沙</h3>
                        <p class="char-series">龙符（梦入神机）</p>
                        <div class="char-tags"><span class="tag tag-power">不可计算扩张率</span><span class="tag tag-realm">不朽第十层·非有无不朽</span></div>
                    </div>
                </a>
            </div>
            <p class="empty" id="no-result" style="display:none">没有匹配的角色</p>
        </section>
    </div>

    <script>
        (function() {
            var input = document.getElementById('name-filter');
            var cards = document.querySelectorAll('#char-grid .character-card');
            var noResult = document.getElementById('no-result');
            if (!input) return;
            input.addEventListener('input', function() {
                var q = this.value.trim().toLowerCase();
                var shown = 0;
                cards.forEach(function(c) {
                    var hay = (c.dataset.name + ' ' + c.dataset.series).toLowerCase();
                    var ok = !q || hay.indexOf(q) !== -1;
                    c.style.display = ok ? '' : 'none';
                    if (ok) shown++;
                });
                noResult.style.display = shown === 0 ? '' : 'none';
            });
        })();
    </script>

    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <p class="footer-brand">全作品战力评鉴所</p>
                <p class="footer-note">跨作品角色战力量级评鉴 · 静态资料站</p>
            </div>
            <nav class="footer-nav">
                <a href="/powerwiki/index.html">首页</a>
                <a href="/powerwiki/characters.html">角色图鉴</a>
                <a href="/powerwiki/realm/index.html">境界体系</a>
                <a href="/powerwiki/page/tiers.html">量级体系表</a>
                <a href="/powerwiki/page/rules.html">战力评级规则</a>
                <a href="/powerwiki/page/cosmology.html">材质与破坏能量数据库</a>
                <a href="/powerwiki/search.html">搜索</a>
            </nav>
        </div>
    </footer>

    <script src="/powerwiki/static/js/main.js"></script>
</body>
</html>
